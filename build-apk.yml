name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct Android project structure
        run: |
          mkdir -p app/src/main/java/com/mnasser/cobaltremote
          mkdir -p app/src/main/res/values
          cp -f app_build.gradle.kts app/build.gradle.kts
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f strings.xml app/src/main/res/values/strings.xml
          cp -f MainActivity.kt app/src/main/java/com/mnasser/cobaltremote/MainActivity.kt
          cp -f WebOsClient.kt app/src/main/java/com/mnasser/cobaltremote/WebOsClient.kt
          echo "=== Verified Android Project Tree ==="
          find app -maxdepth 7 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CobaltRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
