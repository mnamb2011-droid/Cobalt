name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project from flattened sources
        run: |
          mkdir -p app/src/main/java/com/mnasser/cobaltremote app/src/main/res/mipmap-nodpi app/src/main/res/values
          cp -f app_build.gradle.kts app/build.gradle.kts
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f MainActivity.kt app/src/main/java/com/mnasser/cobaltremote/MainActivity.kt
          cp -f WebOsClient.kt app/src/main/java/com/mnasser/cobaltremote/WebOsClient.kt
          cp -f KodiClient.kt app/src/main/java/com/mnasser/cobaltremote/KodiClient.kt
          cp -f app-icon.png app/src/main/res/mipmap-nodpi/ic_launcher.png
          cp -f strings.xml app/src/main/res/values/strings.xml
          test -f app/src/main/java/com/mnasser/cobaltremote/MainActivity.kt
          test -f app/src/main/res/mipmap-nodpi/ic_launcher.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CobaltRemote-1.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
